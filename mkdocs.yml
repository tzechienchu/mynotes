  #- '*Source (Local)': './private/local_source.md'
  #- 'TWOT': './TWOT/twot.md'
  - 'Help' : 'Help.md'

markdown_extensions:
  - abbr
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - admonition
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

theme:
  name: material
  features:
    #- navigation.tabs
    #- navigation.tabs.sticky
    #- toc.integrate
    - content.code.select
    - content.code.copy

#plugins:
