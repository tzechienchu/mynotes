site_name: 朱子建 Tze-Chien Chu (Frank) Notes
theme:
  name: material
nav:
  - 'Home': 'index.md'
  - '2025-12': 'Y2025/Y2025-12.md'
  - 'Books': './books/books.md'
  - 'Schematics': './private/schematics.md'
  - 'Pins': 'pins.md'
  - 'Tutorial': 'tutorial.md'
  - 'Resources': 'resources.md'
  - 'Papers': 'papers.md'
  - 'Facts': 'facts.md'
  - 'Github Collection': 'github.md'
  - 'Templates': 'templates.md'
  - 'Quotes & Ideas': './qandi.md'
  - '*Magazins (Local)': './mags/index.md'
  - '*Peoples' : './private/peoples.md'
  - '*Projects': './private/projects.md'
  - '*Personal': './private/personal.md'
  - '*Source (Local)': './private/local_source.md'
  - 'TWOT': './TWOT/twot.md'
  - 'Help' : 'Help.md'

markdown_extensions:
  - abbr
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

theme:
  name: material
  features:
    #- navigation.tabs
    #- navigation.tabs.sticky
    #- toc.integrate
    - content.code.select
    - content.code.copy

