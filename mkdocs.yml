  - 'Pins': 'pins.md'
  - 'Pico': 'PICO_Resources.md'
  - 'Python': 'Python_Resources.md'  
  - 'Litex&FPGA': 'LitexAndFPGA.md' 
  - 'Tutorial': 'tutorial.md'
  - 'Resources': 'resources.md' 
  - 'Papers': 'papers.md'
  - 'Facts': 'facts.md'
  - 'Github Collection': 'github.md'
  - 'Templates': 'templates.md'
  - 'Quotes': './quotes.md'
  - 'Ideas': './ideas.md'
  - 'About Me': './about.md'
  #- 'Schematics': './private/schematics.md'
  - '*Magazins (Local)': './mags/index.md'
  #- '*Peoples' : './private/peoples.md'
  #- '*Projects': './private/projects.md'
