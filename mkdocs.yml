      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

theme:
  name: material
  features:
    #- navigation.tabs
    - toc.integrate
    - content.code.select
    - content.code.copy

